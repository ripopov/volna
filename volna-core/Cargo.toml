[package]
name = "volna-core"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Volna viewer core: document, view models, display-list rendering. No GUI toolkit."

[lib]
crate-type = ["rlib"]

[dependencies]
volna-trace = { path = "../volna-trace" }
vtr = { path = "../vtr" }
anyhow = "1"
futures-channel = "0.3"
log = "0.4"
sha2 = "0.10"
web-time = "1"
url = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
num-rational = "0.4"
num-traits = "0.2"

[features]
testing = ["volna-trace/testing"]

[dev-dependencies]
gethostname = "=1.1.0"
bincode = "=1.3.3"
volna-core = { path = ".", features = ["testing"] }
tempfile = "3"
vtr-cli = { path = "../vtr-cli" }
