name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'vtr/**', 'vtr-capi/**', 'vtr-guard/**', 'volna-trace/**', 'volna-server/README.md', 'volna-core/**', 'volna/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.agents/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'vtr/**', 'vtr-capi/**', 'vtr-guard/**', 'volna-trace/**', 'volna-server/README.md', 'volna-core/**', 'volna/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.agents/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: docs
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DOCS_BASE: /volna/
      DOCS_SITE: https://ripopov.github.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Upload browser verification report
        uses: actions/upload-artifact@v6
        if: ${{ always() && hashFiles('docs/test-results/report.json') != '' }}
        with:
          name: docs-browser-verification
          path: docs/test-results/report.json
          retention-days: 3
          if-no-files-found: error
      - name: Upload browser screenshots on failure
        uses: actions/upload-artifact@v6
        if: ${{ failure() && hashFiles('docs/test-results/**/*.png') != '' }}
        with:
          name: docs-browser-screenshots
          path: docs/test-results/**/*.png
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: volna-static-docs
          path: docs/dist/
          retention-days: 3
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
