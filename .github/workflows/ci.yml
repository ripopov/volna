name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vtr-capi-install:
    name: Install and consume VTR C API (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Install and link an external C consumer
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vtr-capi"
          ./vtr-capi/install.sh --target-dir "$out/target" --prefix "$out/prefix"
          ./vtr-capi/install.sh --target-dir "$out/target" --prefix "$out/prefix"
          cp vtr-capi/tests/c_smoke.c "$out/c_smoke.c"
          export PKG_CONFIG_PATH="$out/prefix/lib/pkgconfig"
          cc -std=c99 -Wall -Wextra -Werror -O1 \
            $(pkg-config --cflags vtr) "$out/c_smoke.c" \
            $(pkg-config --static --libs vtr) -o "$out/c_smoke"
          "$out/c_smoke" "$out/trace.vtr"
          ./vtr-capi/install.sh --target-dir "$out/target-debug" --prefix "$out/prefix-debug" --debug
          export PKG_CONFIG_PATH="$out/prefix-debug/lib/pkgconfig"
          cc -std=c99 -Wall -Wextra -Werror -O1 \
            $(pkg-config --cflags vtr) "$out/c_smoke.c" \
            $(pkg-config --static --libs vtr) -o "$out/c_smoke_debug"
          "$out/c_smoke_debug" "$out/trace-debug.vtr"
          "$out/c_smoke" "$out/trace-again.vtr"
          test -z "$(git status --porcelain)"

  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: "1.97.1"
          - os: windows-latest
            rust: stable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --all-targets --locked
      - name: Exercise examples
        shell: bash
        run: |
          cargo run -p vtr --locked --example waveform -- "$RUNNER_TEMP/waveform.vtr"
          cargo run -p vtr --locked --example logging -- "$RUNNER_TEMP/logging.vtr"
          cargo run -p vtr-cli --locked -- convert vtr-cli/tests/fixtures/pipeline.kanata "$RUNNER_TEMP/pipeline.vtr"
          cargo run -p vtr-cli --locked -- clocks "$RUNNER_TEMP/pipeline.vtr"
          cargo run -p vtr-cli --locked -- convert vtr-cli/tests/fixtures/waves.vcd "$RUNNER_TEMP/imported.vtr"
          cargo run -p vtr-cli --locked -- value "$RUNNER_TEMP/imported.vtr" 'top.bus [3:0]' 5

  quality:
    name: Format, lint, docs, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo package -p vtr --locked

  vtr-msrv:
    name: VTR minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.97.1 test --locked -p vtr
