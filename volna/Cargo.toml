[package]
name = "volna"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
autoexamples = false
default-run = "volna"
description = "GPUI viewer for VTR and FST recordings"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "volna"
path = "src/main.rs"

[[example]]
name = "analog_showcase"
path = "examples/analog_showcase.rs"

[[example]]
name = "gpu_transaction_trace"
path = "examples/gpu_transaction_trace.rs"

[features]
default = []

[dependencies]
volna-trace = { version = "0.1.0", path = "../volna-trace" }
gpui-kit = { version = "=0.7.3", features = ["profiler"] }
volna-core = { version = "0.1.0", path = "../volna-core" }
anyhow = "1"
futures = "0.3"
hdrhistogram = { version = "7", default-features = false }
log = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lsp-types = "0.97"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
env_logger = "0.11"
tempfile = "3"
url = "2"
notify = "7"
gpui-kit = { version = "=0.7.3", features = ["tree-sitter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
volna-core = { version = "0.1.0", path = "../volna-core", features = ["testing"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
vtr = { version = "0.1.0", path = "../vtr" }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true
