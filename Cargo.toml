[workspace]
members = ["vtr", "vtr-capi", "vtr-guard", "volna-trace", "volna-server", "vtr-cli", "volna-core", "volna"]
resolver = "3"
default-members = ["vtr", "vtr-capi", "vtr-guard", "volna-trace", "volna-server", "vtr-cli", "volna-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/ripopov/volna"

[workspace.dependencies]
vtr = { path = "vtr" }
crc32fast = "1.4"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
memmap2 = "0.9"
rand = "0.8"
tempfile = "3"
thiserror = "2"
zstd = { version = "0.13", default-features = false }
zstd-sys = { version = "2.0.16", default-features = false, features = ["experimental"] }
