[package]
name = "volna-trace"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.96"
readme = "README.md"
description = "Standalone immutable trace access and complete-object remote loading"

[dependencies]
crc32fast.workspace = true
memmap2.workspace = true
tempfile.workspace = true
vtr.workspace = true
anyhow = "1"
bincode = "=1.3.3"
lz4_flex = { workspace = true, features = ["frame"] }
fst-reader = "0.17"
flate2 = "1"
serde = { version = "1", features = ["derive"] }

[features]
# Shared procedural histories for headless loader and viewer tests.
testing = []

[dev-dependencies]
serde_json = "1"
volna-trace = { path = ".", features = ["testing"] }
