[package]
name = "volna-trace"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Standalone immutable trace access and complete-object remote loading"

[dependencies]
vtr.workspace = true
anyhow = "1"
bincode = "=1.3.3"
lz4_flex = { workspace = true, features = ["frame"] }
serde = { version = "1", features = ["derive"] }

[features]
testing = []

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"
volna-trace = { version = "0.1.0", path = ".", features = ["testing"] }

[lints]
workspace = true
