[package]
name = "vtr-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Stable C ABI for the VTR trace library (libvtr)"

[lib]
name = "vtr"
crate-type = ["cdylib", "staticlib"]
doc = false

[features]
# libvtr allocates from its own heap so a locked application heap cannot block
# the crash guard's rescue. This increases memory use and is opt-in.
private-heap = ["dep:mimalloc"]

[dependencies]
vtr.workspace = true
vtr-guard = { path = "../vtr-guard" }
# mimalloc without `override`, so the application's malloc is untouched.
mimalloc = { version = "0.1", default-features = false, optional = true }
libc = "0.2"

[dev-dependencies]
cc = "1"
serde_json = "1"
tempfile = "3"
